version: "2"
sql:
  - engine: "mysql"
    schema:
      - "../db/migrations/001_schema.up.sql"
      - "../db/migrations/003_batch_scoping.up.sql"
      - "../db/migrations/004_late_penalty.up.sql"
      - "../db/migrations/005_rubric_criteria.up.sql"
      - "../db/migrations/006_notification_intent.up.sql"
      # 007 omitted: trigger DDL sqlc cannot parse; audit needs no generated code.
      - "../db/migrations/008_uploads.up.sql"
    queries: "../db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true
